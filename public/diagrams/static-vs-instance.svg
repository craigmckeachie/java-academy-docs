<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="640" height="330" rx="12" fill="#ffffff"/>
  <!-- class box -->
  <rect x="200" y="24" width="240" height="96" rx="8" fill="#e7f5ff" stroke="#1971c2" stroke-width="3"/>
  <text x="320" y="52" font-size="19" font-weight="bold" fill="#1971c2" text-anchor="middle">BankAccount (the class)</text>
  <line x1="200" y1="64" x2="440" y2="64" stroke="#1971c2" stroke-width="2"/>
  <text x="320" y="92" font-size="17" fill="#212529" text-anchor="middle">static interestRate</text>
  <text x="320" y="112" font-size="13" fill="#495057" text-anchor="middle">one copy, shared by every account</text>
  <!-- arrows -->
  <line x1="170" y1="200" x2="270" y2="126" stroke="#868e96" stroke-width="2.5" stroke-dasharray="7 5"/>
  <line x1="470" y1="200" x2="370" y2="126" stroke="#868e96" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="182" y="150" font-size="13" fill="#495057" text-anchor="middle">uses</text>
  <text x="458" y="150" font-size="13" fill="#495057" text-anchor="middle">uses</text>
  <!-- objects -->
  <rect x="60" y="204" width="220" height="96" rx="8" fill="#fff4e6" stroke="#e8590c" stroke-width="3"/>
  <text x="170" y="232" font-size="19" font-weight="bold" fill="#e8590c" text-anchor="middle">acct1 (an object)</text>
  <line x1="60" y1="244" x2="280" y2="244" stroke="#e8590c" stroke-width="2"/>
  <text x="170" y="272" font-size="17" fill="#212529" text-anchor="middle">balance</text>
  <text x="170" y="292" font-size="13" fill="#495057" text-anchor="middle">its own</text>
  <rect x="360" y="204" width="220" height="96" rx="8" fill="#fff4e6" stroke="#e8590c" stroke-width="3"/>
  <text x="470" y="232" font-size="19" font-weight="bold" fill="#e8590c" text-anchor="middle">acct2 (an object)</text>
  <line x1="360" y1="244" x2="580" y2="244" stroke="#e8590c" stroke-width="2"/>
  <text x="470" y="272" font-size="17" fill="#212529" text-anchor="middle">balance</text>
  <text x="470" y="292" font-size="13" fill="#495057" text-anchor="middle">its own</text>
</svg>
